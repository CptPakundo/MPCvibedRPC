# The tests that read documentation. ci.yml skips a change that touches only documentation (top-level .md files, docs/,
# the issue templates), but these tests check the texts against the code: every setting in docs/config.md, every
# player named in the texts that list them, every address in SECURITY.md, every relative link and anchor in the Markdown files, and the release notes rendered
# from the changelog. So they run on every push and pull request, with no paths filter. They are quick and need Linux only.
name: docs
on:
  push:
    branches: ['**', '!master']
    tags-ignore: ['v*']
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}-${{ github.event.action || github.event_name }}
  cancel-in-progress: true
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version-file: go.mod, cache: false }
      - run: go test -count=1 -run 'TestEverySettingIsDocumented' ./internal/store
      - run: go test -count=1 -run 'TestPlayersAreNamedEverywhere' ./cmd/mpcvibedrpc
      - run: go test -count=1 -run 'TestSecurityListsEveryHost|TestEveryHostIsListed' ./internal/core
      - run: go test -count=1 ./tools/relnotes
      - run: go test -count=1 ./tools/doclinks
