# Temporary: finds out why Chrome opens an extra window on macOS. Deleted before merging.
name: probe
on:
  push:
    branches: [multi-os]
    paths: ['tools/ci/probe-chrome.sh', '.github/workflows/probe.yml']
jobs:
  chrome:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: bash tools/ci/probe-chrome.sh
