# Tests on Linux (with the race detector) and Windows, then builds the Windows program and smoke-tests it for real.
name: ci
on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.24', cache: false }
      - run: ./tools/ci/run-annotated.sh "go vet" go vet ./...
        shell: bash
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo 'Run gofmt -w on the files above.'; exit 1; }
        shell: bash
      - name: Test (with the race detector)
        if: runner.os == 'Linux'
        run: ./tools/ci/run-annotated.sh "go test -race" ./tools/ci/test-noskip.sh 'TestLivePlayer' go test -race -count=1 ./...
        shell: bash
      - name: Test
        if: runner.os != 'Linux'
        # the Unix-socket fakes and the end-to-end run are Linux-only; the smoke test covers them on Windows
        run: ./tools/ci/run-annotated.sh "go test" ./tools/ci/test-noskip.sh 'TestLivePlayer|TestEndToEnd|TestLoginAndActivity|TestErrorReply|TestHandshakeTimeout|TestServerCloseFailsPending' go test -count=1 ./...
        shell: bash

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.24', cache: false }
      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          go run ./tools/mkrsrc -version 0.9.8 -out cmd/mpcvibedrpc/rsrc_windows_amd64.syso
          go build -trimpath -ldflags "-H=windowsgui -s -w -X main.version=0.9.8" -o dist/MPCvibedRPC.exe ./cmd/mpcvibedrpc
          go run ./tools/mkrsrc -version 0.9.9 -out cmd/mpcvibedrpc/rsrc_windows_amd64.syso
          go build -trimpath -ldflags "-H=windowsgui -s -w -X main.version=0.9.9" -o dist/next.exe ./cmd/mpcvibedrpc
          Get-ChildItem dist | Format-Table Name, Length
          Write-Host "::notice title=exe size::$((Get-Item dist/MPCvibedRPC.exe).Length) bytes"
      - name: Smoke test
        shell: pwsh
        run: ./tools/ci/smoke.ps1 -Exe "$PWD/dist/MPCvibedRPC.exe" -NewExe "$PWD/dist/next.exe" -Version 0.9.8 -NextVersion 0.9.9
      - uses: actions/upload-artifact@v7
        with:
          name: MPCvibedRPC-windows
          path: dist/MPCvibedRPC.exe
