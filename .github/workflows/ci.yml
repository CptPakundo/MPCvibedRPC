# Tests on Linux (with the race detector), Windows and macOS, then builds the program for each system and smoke-tests
# it for real, and runs the engine against real players on Linux and macOS.
name: ci
on:
  # A change to documentation only (the README and other top-level .md files, docs/, the issue templates, the release
  # notes) changes nothing that is built or run, so it is not tested; a change that also touches anything else is.
  push:
    branches: ['**']
    tags-ignore: ['v*']
    paths-ignore: ['*.md', 'docs/**', '.github/ISSUE_TEMPLATE/**', '.github/release-notes.md']
  pull_request:
    paths-ignore: ['*.md', 'docs/**', '.github/ISSUE_TEMPLATE/**', '.github/release-notes.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.24', cache: false }
      - run: ./tools/ci/run-annotated.sh "go vet" go vet ./...
        shell: bash
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo 'Run gofmt -w on the files above.'; exit 1; }
        shell: bash
      - name: Test (with the race detector)
        if: runner.os == 'Linux'
        run: ./tools/ci/run-annotated.sh "go test -race" ./tools/ci/test-noskip.sh 'TestLivePlayer' go test -race -count=1 ./...
        shell: bash
      - name: Test
        if: runner.os == 'macOS'
        run: ./tools/ci/run-annotated.sh "go test" ./tools/ci/test-noskip.sh 'TestLivePlayer' go test -count=1 ./...
        shell: bash
      - name: Test
        if: runner.os == 'Windows'
        # the Unix-socket fakes and the end-to-end run are Linux-only; the smoke test covers them on Windows
        run: ./tools/ci/run-annotated.sh "go test" ./tools/ci/test-noskip.sh 'TestLivePlayer|TestEndToEnd|TestLoginAndActivity|TestErrorReply|TestHandshakeTimeout|TestServerCloseFailsPending' go test -count=1 ./...
        shell: bash

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.24', cache: false }
      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          go run ./tools/mkrsrc -version 0.9.12 -out cmd/mpcvibedrpc/rsrc_windows_amd64.syso
          go build -trimpath -ldflags "-H=windowsgui -s -w -X main.version=0.9.12" -o dist/MPCvibedRPC.exe ./cmd/mpcvibedrpc
          go run ./tools/mkrsrc -version 0.9.13 -out cmd/mpcvibedrpc/rsrc_windows_amd64.syso
          go build -trimpath -ldflags "-H=windowsgui -s -w -X main.version=0.9.13" -o dist/next.exe ./cmd/mpcvibedrpc
          Get-ChildItem dist | Format-Table Name, Length
          Write-Host "::notice title=exe size::$((Get-Item dist/MPCvibedRPC.exe).Length) bytes"
      - name: Smoke test
        shell: pwsh
        run: ./tools/ci/smoke.ps1 -Exe "$PWD/dist/MPCvibedRPC.exe" -NewExe "$PWD/dist/next.exe" -Version 0.9.12 -NextVersion 0.9.13
      - uses: actions/upload-artifact@v7
        with:
          name: MPCvibedRPC-windows
          path: dist/MPCvibedRPC.exe

  # The Linux programs and the macOS app, built as a release builds them, then started for real in throwaway folders.
  unix:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.24', cache: false }
      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=0.9.12" -o dist/MPCvibedRPC-linux-$arch ./cmd/mpcvibedrpc
          done
          ls -l dist
          echo "::notice title=linux-amd64 size::$(stat -c %s dist/MPCvibedRPC-linux-amd64) bytes"
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          PASSED_FILE="$RUNNER_TEMP/smoke-ok" ./tools/ci/run-annotated.sh "smoke test" ./tools/ci/smoke-unix.sh "$PWD/dist/MPCvibedRPC-linux-amd64" 0.9.12
          test -f "$RUNNER_TEMP/smoke-ok" || { echo "::error title=smoke test::the script stopped before the end"; exit 1; }
        shell: bash
      - name: Build (macOS app)
        if: runner.os == 'macOS'
        run: ./tools/ci/package-macos.sh 0.9.12 dist
        shell: bash
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/app" && ditto -x -k dist/MPCvibedRPC-macos.zip "$RUNNER_TEMP/app"
          app="$RUNNER_TEMP/app/MPCvibedRPC.app"
          SCREENSHOT="$RUNNER_TEMP/macos-window.png" PASSED_FILE="$RUNNER_TEMP/smoke-ok" ./tools/ci/run-annotated.sh "smoke test" ./tools/ci/smoke-unix.sh "$app/Contents/MacOS/MPCvibedRPC" 0.9.12 "$app"
          test -f "$RUNNER_TEMP/smoke-ok" || { echo "::error title=smoke test::the script stopped before the end"; exit 1; }
      - name: Screenshot of the settings window and menu bar (macOS)
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: macos-screenshot
          path: ${{ runner.temp }}/macos-window*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: MPCvibedRPC-${{ runner.os == 'macOS' && 'macos' || 'linux' }}
          path: dist/*

  # The engine against real players (the test's own fake Discord): mpv, VLC, mpv-mpris and Celluloid on Linux; mpv
  # and IINA (set up by the real program) on macOS.
  players:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.24', cache: false }
      - name: Install players (Linux)
        timeout-minutes: 10 # a slow package mirror once hung here
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg mpv mpv-mpris vlc vlc-plugin-base celluloid xvfb dbus dbus-x11 > /dev/null
          mpv --version | head -n 1; cvlc --version 2> /dev/null | head -n 1; celluloid --version || true
      - name: Install players (macOS)
        timeout-minutes: 10
        if: runner.os == 'macOS'
        run: |
          brew install --quiet mpv ffmpeg
          brew install --quiet --cask iina
          xattr -dr com.apple.quarantine /Applications/IINA.app # a first-start prompt would wait for a click forever
          mpv --version | head -n 1
          defaults read /Applications/IINA.app/Contents/Info.plist CFBundleShortVersionString
      - name: Live tests
        # Linux: inside a session bus of its own, for MPRIS
        run: |
          bus=""; [ "$RUNNER_OS" = Linux ] && bus="dbus-run-session --"
          PASSED_FILE="$RUNNER_TEMP/live-ok" ./tools/ci/run-annotated.sh "live players" $bus ./tools/ci/live-players.sh
          test -f "$RUNNER_TEMP/live-ok" || { echo "::error title=live players::the script stopped before the end"; exit 1; }
        shell: bash
  plex:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.24', cache: false }
      - name: Install ffmpeg
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null
      - name: Live test (Plex Media Server)
        # the official server image, unclaimed; a stand-in player reports playback to it
        run: |
          PASSED_FILE="$RUNNER_TEMP/plex-ok" ./tools/ci/run-annotated.sh "live Plex" ./tools/ci/live-plex.sh
          test -f "$RUNNER_TEMP/plex-ok" || { echo "::error title=live Plex::the script stopped before the end"; exit 1; }
        shell: bash
