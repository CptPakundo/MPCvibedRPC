# Every push: tests on Linux (with the race detector, gofmt, govulncheck, staticcheck and deadcode), Windows and macOS,
# then the programs built for each system and smoke-tested for real, and the Windows exe rebuilt on Linux to prove it
# is reproducible. Once per pull request (when it is opened, reopened or marked ready; also by hand, and in the weekly
# canary): the live jobs, which install real players and real media servers on throwaway runners and run the engine
# against them. A pull request's later pushes run only the fast jobs; the canary runs everything against the newest
# players and servers every week.
name: ci
on:
  # A change to documentation only (the README and other top-level .md files, docs/, the issue templates) changes
  # nothing that is built or run, so it is not tested; a change that also touches anything else is. master is not
  # tested on push: its commits come from a pull request whose branch was tested, and the release run tests the tagged
  # commit again before anything is published.
  push:
    branches: ['**', '!master']
    tags-ignore: ['v*']
    paths-ignore: ['*.md', 'docs/**', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    paths-ignore: ['*.md', 'docs/**', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:
  workflow_call: # the weekly canary (canary.yml) runs all of it against the newest players and servers
permissions:
  contents: read
# A newer push to the same branch or pull request replaces a run that is still going. The event's action is part of
# the group, so a pull request's later pushes (synchronize) never cancel the run its opening started: that is the one
# with the live jobs.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event.action || github.event_name }}
  cancel-in-progress: true
jobs:
  test:
    # A pull request from this repository is already tested by the push of its branch; only pull requests from forks
    # (which get no push run here) are tested through the pull_request event. The build jobs need this one.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache: false }
      - run: ./tools/ci/run-annotated.sh "go vet" go vet ./...
        shell: bash
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo 'Run gofmt -w on the files above.'; exit 1; }
        shell: bash
      - name: govulncheck
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        shell: bash
      # staticcheck without ST1005: the program's error texts are sentences, because the window shows them to the user.
      # deadcode: every function must be reachable from the program or a test; delete what is not, or say why it stays.
      - name: staticcheck and deadcode
        if: runner.os == 'Linux'
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 -checks inherit,-ST1005 ./...
          dead="$(go run golang.org/x/tools/cmd/deadcode@v0.52.0 -test ./...)"
          test -z "$dead" || { echo "$dead"; echo 'Unreachable code: delete it, or explain in a comment why it must stay.'; exit 1; }
        shell: bash
      - name: Test (with the race detector)
        if: runner.os == 'Linux'
        run: ./tools/ci/run-annotated.sh "go test -race" ./tools/ci/test-noskip.sh "$(./tools/ci/allowed-skips.sh)" go test -race -count=1 ./...
        shell: bash
      - name: Test
        if: runner.os != 'Linux'
        run: ./tools/ci/run-annotated.sh "go test" ./tools/ci/test-noskip.sh "$(./tools/ci/allowed-skips.sh)" go test -count=1 ./...
        shell: bash

  # The Windows exe as a release builds it (.github/actions/build-windows), smoke-tested for real.
  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # the files as the repository has them (LF), and no cgo: the same input and build as the Linux rebuild below
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache: false }
      - run: ./tools/ci/version.sh
        shell: bash
      - uses: ./.github/actions/build-windows
        with: { version: "${{ env.VERSION }}", next: "${{ env.NEXT }}" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MPCvibedRPC-windows
          path: dist/MPCvibedRPC.exe

  # The exe again, built on Linux from the same files: it must be the same, byte for byte, so anyone can rebuild a
  # release and check it (release.yml does that for every release before it is published).
  reproduce:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache: false }
      - run: ./tools/ci/version.sh
        shell: bash
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MPCvibedRPC-windows
          path: windows
      - name: Rebuild and compare
        shell: bash
        run: ./tools/ci/reproduce.sh "$VERSION" rebuilt && ./tools/ci/reproduce.sh compare windows/MPCvibedRPC.exe rebuilt/MPCvibedRPC.exe

  # The Linux programs and the macOS app as a release builds them (.github/actions/build-unix), started for real in
  # throwaway folders.
  unix:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache: false }
      - run: ./tools/ci/version.sh
        shell: bash
      - uses: ./.github/actions/build-unix
        with: { version: "${{ env.VERSION }}" }
      - name: Screenshot of the settings window and menu bar (macOS)
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-screenshot
          path: ${{ runner.temp }}/macos-window*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MPCvibedRPC-${{ runner.os == 'macOS' && 'macos' || 'linux' }}
          path: dist/*

  # The live jobs below run once per pull request (opened, reopened or marked ready), by hand, and from the canary: not
  # on every push, which the fast jobs above cover. They need no job before them; each installs what it tests.
  # The engine against real players (the test's own fake Discord): mpv, VLC, mpv-mpris and Celluloid on Linux; mpv
  # and IINA (set up by the real program) on macOS.
  players:
    if: github.event_name != 'push' && !(github.event_name == 'pull_request' && github.event.action == 'synchronize')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache: false }
      - name: Install players (Linux)
        timeout-minutes: 10 # a slow package mirror once hung here
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg mpv mpv-mpris vlc vlc-plugin-base celluloid xvfb dbus dbus-x11 > /dev/null
          mpv --version | head -n 1; cvlc --version 2> /dev/null | head -n 1; celluloid --version || true
      - name: Install players (macOS)
        timeout-minutes: 10
        if: runner.os == 'macOS'
        run: |
          brew install --quiet mpv ffmpeg
          brew install --quiet --cask iina
          xattr -dr com.apple.quarantine /Applications/IINA.app # a first-start prompt would wait for a click forever
          mpv --version | head -n 1
          defaults read /Applications/IINA.app/Contents/Info.plist CFBundleShortVersionString
      - name: Live tests
        # Linux: inside a session bus of its own, for MPRIS
        run: |
          bus=""; [ "$RUNNER_OS" = Linux ] && bus="dbus-run-session --"
          PASSED_FILE="$RUNNER_TEMP/live-ok" ./tools/ci/run-annotated.sh "live players" $bus ./tools/ci/live-players.sh
        shell: bash
  # The engine against real PotPlayer and Kodi on Windows (installed from Chocolatey; the test's own fake Discord).
  players-windows:
    if: github.event_name != 'push' && !(github.event_name == 'pull_request' && github.event.action == 'synchronize')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache: false }
      - name: Live tests (PotPlayer, Kodi)
        timeout-minutes: 20
        run: PASSED_FILE="$RUNNER_TEMP/live-ok" ./tools/ci/run-annotated.sh "live players (Windows)" ./tools/ci/live-windows.sh
        shell: bash
  plex:
    if: github.event_name != 'push' && !(github.event_name == 'pull_request' && github.event.action == 'synchronize')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache: false }
      - name: Install ffmpeg
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null
      - name: Live test (Plex Media Server)
        # the official server image, unclaimed; a stand-in player reports playback to it
        run: PASSED_FILE="$RUNNER_TEMP/plex-ok" ./tools/ci/run-annotated.sh "live Plex" ./tools/ci/live-plex.sh
        shell: bash
  jellyfin:
    if: github.event_name != 'push' && !(github.event_name == 'pull_request' && github.event.action == 'synchronize')
    strategy:
      fail-fast: false
      matrix:
        server: [jellyfin, emby]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache: false }
      - name: Install ffmpeg
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null
      - name: Live test (${{ matrix.server }})
        # the official server image, set up with a made-up user; a stand-in player reports playback to it
        env:
          SERVER: ${{ matrix.server }}
        run: PASSED_FILE="$RUNNER_TEMP/jf-ok" ./tools/ci/run-annotated.sh "live $SERVER" ./tools/ci/live-jellyfin.sh "$SERVER"
        shell: bash
