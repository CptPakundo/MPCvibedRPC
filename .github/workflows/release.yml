# Publishes a release when a version tag is pushed:   git tag -a vX.Y.Z -m "MPCvibedRPC X.Y.Z" && git push origin vX.Y.Z
# The tag must match the version in cmd/mpcvibedrpc/main.go. The program's own updater looks for its file
# (MPCvibedRPC.exe, MPCvibedRPC-linux-amd64, ...) and the .sha256 next to it on the latest release; on macOS it links to
# the release page. Once published, the release is checked as a user gets it (tools/ci/verify-release.ps1).
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write          # for the build provenance attestation
  attestations: write
  artifact-metadata: write
jobs:
  # The Linux programs and the macOS app, tested, built and smoke-tested on their own systems.
  unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.24', cache: false }
      - run: ./tools/ci/version.sh '${{ github.ref_name }}'
        shell: bash
      - run: go test -count=1 ./...
      - name: Build and smoke-test
        shell: bash
        run: |
          v="$VERSION"
          mkdir -p dist
          if [ "$RUNNER_OS" = Linux ]; then
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$v" -o dist/MPCvibedRPC-linux-$arch ./cmd/mpcvibedrpc
            done
            PASSED_FILE="$RUNNER_TEMP/smoke-ok" ./tools/ci/smoke-unix.sh "$PWD/dist/MPCvibedRPC-linux-amd64" "$v"
          else
            ./tools/ci/package-macos.sh "$v" dist
            mkdir -p "$RUNNER_TEMP/app" && ditto -x -k dist/MPCvibedRPC-macos.zip "$RUNNER_TEMP/app"
            PASSED_FILE="$RUNNER_TEMP/smoke-ok" ./tools/ci/smoke-unix.sh "$RUNNER_TEMP/app/MPCvibedRPC.app/Contents/MacOS/MPCvibedRPC" "$v" "$RUNNER_TEMP/app/MPCvibedRPC.app"
          fi
          test -f "$RUNNER_TEMP/smoke-ok" || { echo "the smoke test stopped before the end"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: unix-${{ matrix.os }}
          path: dist/*

  release:
    needs: unix
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.24', cache: false }
      - run: ./tools/ci/version.sh '${{ github.ref_name }}'
        shell: bash
      - run: go test -count=1 ./...
      - name: Build
        shell: pwsh
        run: |
          $v, $next = $env:VERSION, $env:NEXT
          New-Item -ItemType Directory dist | Out-Null
          go run ./tools/mkrsrc -version $v -out cmd/mpcvibedrpc/rsrc_windows_amd64.syso
          go build -trimpath -ldflags "-H=windowsgui -s -w -X main.version=$v" -o dist/MPCvibedRPC.exe ./cmd/mpcvibedrpc
          go run ./tools/mkrsrc -version $next -out cmd/mpcvibedrpc/rsrc_windows_amd64.syso
          go build -trimpath -ldflags "-H=windowsgui -s -w -X main.version=$next" -o dist/next.exe ./cmd/mpcvibedrpc
          ./tools/ci/smoke.ps1 -Exe "$PWD/dist/MPCvibedRPC.exe" -NewExe "$PWD/dist/next.exe" -Version $v -NextVersion $next
          Remove-Item dist/next.exe
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md dist/
      - uses: actions/download-artifact@v8
        with:
          pattern: unix-*
          path: dist
          merge-multiple: true
      - name: Checksums
        shell: pwsh
        run: |
          foreach ($f in 'MPCvibedRPC.exe', 'MPCvibedRPC-linux-amd64', 'MPCvibedRPC-linux-arm64', 'MPCvibedRPC-macos.zip') {
            $h = (Get-FileHash "dist/$f" -Algorithm SHA256).Hash.ToLower()
            Set-Content -LiteralPath "dist/$f.sha256" -Value "$h  $f`n" -NoNewline
          }
          Get-ChildItem dist | Format-Table Name, Length
      # A signed statement that these files were built from this repository by this workflow (no certificate needed).
      # Check a download with:   gh attestation verify MPCvibedRPC.exe --repo CptPakundo/MPCvibedRPC
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/MPCvibedRPC.exe
            dist/MPCvibedRPC-linux-amd64
            dist/MPCvibedRPC-linux-arm64
            dist/MPCvibedRPC-macos.zip
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/MPCvibedRPC.exe
            dist/MPCvibedRPC.exe.sha256
            dist/MPCvibedRPC-linux-amd64
            dist/MPCvibedRPC-linux-amd64.sha256
            dist/MPCvibedRPC-linux-arm64
            dist/MPCvibedRPC-linux-arm64.sha256
            dist/MPCvibedRPC-macos.zip
            dist/MPCvibedRPC-macos.zip.sha256
            dist/LICENSE
            dist/THIRD-PARTY-NOTICES.md
          body_path: .github/release-notes.md
          fail_on_unmatched_files: true

  # The published release, as a user downloads it: the files, their checksums and build records, the exe's version,
  # and a real self-update from the release before it (its own data folder, no window, no Discord needed).
  verify:
    needs: release
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@v7
      - run: ./tools/ci/version.sh '${{ github.ref_name }}'
        shell: bash
      - name: Verify the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/ci/verify-release.ps1 -Version $env:VERSION
