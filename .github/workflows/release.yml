# Publishes a release when a version tag is pushed:   git tag -a vX.Y.Z -m "MPCvibedRPC X.Y.Z" && git push origin vX.Y.Z
# The tag must match the version in cmd/mpcvibedrpc/main.go. The program's own updater looks for its file
# (MPCvibedRPC.exe, MPCvibedRPC-linux-amd64, ...) and the .sha256 next to it on the latest release; on macOS it links to
# the release page. The release is first a draft; it is made public only once its files check out, and then the update
# path is tried on it (tools/ci/verify-release.ps1).
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read # each job asks for what it needs
jobs:
  # The Linux programs and the macOS app, tested, built and smoke-tested on their own systems.
  unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.27.3', cache: false }
      - run: ./tools/ci/version.sh '${{ github.ref_name }}'
        shell: bash
      - run: ./tools/ci/test-noskip.sh "$(./tools/ci/allowed-skips.sh)" go test -count=1 ./...
        shell: bash
      - name: Build and smoke-test
        shell: bash
        run: |
          v="$VERSION"
          mkdir -p dist
          if [ "$RUNNER_OS" = Linux ]; then
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version=$v" -o dist/MPCvibedRPC-linux-$arch ./cmd/mpcvibedrpc
            done
            PASSED_FILE="$RUNNER_TEMP/smoke-ok" ./tools/ci/smoke-unix.sh "$PWD/dist/MPCvibedRPC-linux-amd64" "$v"
          else
            ./tools/ci/package-macos.sh "$v" dist
            mkdir -p "$RUNNER_TEMP/app" && ditto -x -k dist/MPCvibedRPC-macos.zip "$RUNNER_TEMP/app"
            PASSED_FILE="$RUNNER_TEMP/smoke-ok" ./tools/ci/smoke-unix.sh "$RUNNER_TEMP/app/MPCvibedRPC.app/Contents/MacOS/MPCvibedRPC" "$v" "$RUNNER_TEMP/app/MPCvibedRPC.app"
          fi
          test -f "$RUNNER_TEMP/smoke-ok" || { echo "the smoke test stopped before the end"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unix-${{ matrix.os }}
          path: dist/*

  release:
    needs: unix
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write          # the draft release
      id-token: write          # for the build provenance attestation
      attestations: write
      artifact-metadata: write
    outputs: # the files' SHA-256, for reproduce
      exe: ${{ steps.sums.outputs.exe }}
      linux_amd64: ${{ steps.sums.outputs.linux_amd64 }}
      linux_arm64: ${{ steps.sums.outputs.linux_arm64 }}
    steps:
      # the files as the repository has them (LF), as reproduce builds them
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.27.3', cache: false }
      - run: ./tools/ci/version.sh '${{ github.ref_name }}'
        shell: bash
      - run: ./tools/ci/test-noskip.sh "$(./tools/ci/allowed-skips.sh)" go test -count=1 ./...
        shell: bash
      - name: Build
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0' # Windows needs no cgo; without it the exe can be rebuilt anywhere
          $v, $next = $env:VERSION, $env:NEXT
          New-Item -ItemType Directory dist | Out-Null
          go run ./tools/mkrsrc -version $v -out cmd/mpcvibedrpc/rsrc_windows_amd64.syso
          go build -trimpath -buildvcs=false -ldflags "-H=windowsgui -s -w -X main.version=$v" -o dist/MPCvibedRPC.exe ./cmd/mpcvibedrpc
          go run ./tools/mkrsrc -version $next -out cmd/mpcvibedrpc/rsrc_windows_amd64.syso
          go build -trimpath -buildvcs=false -ldflags "-H=windowsgui -s -w -X main.version=$next" -o dist/next.exe ./cmd/mpcvibedrpc
          ./tools/ci/smoke.ps1 -Exe "$PWD/dist/MPCvibedRPC.exe" -NewExe "$PWD/dist/next.exe" -Version $v -NextVersion $next
          Remove-Item dist/next.exe
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unix-*
          path: dist
          merge-multiple: true
      - name: Checksums
        id: sums
        shell: pwsh
        run: |
          foreach ($f in 'MPCvibedRPC.exe', 'MPCvibedRPC-linux-amd64', 'MPCvibedRPC-linux-arm64', 'MPCvibedRPC-macos.zip') {
            $h = (Get-FileHash "dist/$f" -Algorithm SHA256).Hash.ToLower()
            Set-Content -LiteralPath "dist/$f.sha256" -Value "$h  $f`n" -NoNewline
            $key = @{ 'MPCvibedRPC.exe' = 'exe'; 'MPCvibedRPC-linux-amd64' = 'linux_amd64'; 'MPCvibedRPC-linux-arm64' = 'linux_arm64' }[$f]
            if ($key) { Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "$key=$h" }
          }
          Get-ChildItem dist | Format-Table Name, Length
      # A signed statement that these files were built from this repository by this workflow (no certificate needed).
      # Check a download with:   gh attestation verify MPCvibedRPC.exe --repo CptPakundo/MPCvibedRPC
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/MPCvibedRPC.exe
            dist/MPCvibedRPC-linux-amd64
            dist/MPCvibedRPC-linux-arm64
            dist/MPCvibedRPC-macos.zip
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/MPCvibedRPC.exe
            dist/MPCvibedRPC.exe.sha256
            dist/MPCvibedRPC-linux-amd64
            dist/MPCvibedRPC-linux-amd64.sha256
            dist/MPCvibedRPC-linux-arm64
            dist/MPCvibedRPC-linux-arm64.sha256
            dist/MPCvibedRPC-macos.zip
            dist/MPCvibedRPC-macos.zip.sha256
            dist/LICENSE
            dist/THIRD-PARTY-NOTICES.md
          body_path: .github/release-notes.md
          fail_on_unmatched_files: true
          draft: true # made public by the verify job, once the files check out

  # Every program file again, built on another runner from the tag: each must match the release's byte for byte, or
  # the draft is not published. Anyone can do the same with tools/ci/reproduce.sh (LF checkout, the same Go).
  reproduce:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.27.3', cache: false }
      - run: ./tools/ci/version.sh '${{ github.ref_name }}'
        shell: bash
      - name: Rebuild and compare
        shell: bash
        run: |
          ./tools/ci/reproduce.sh "$VERSION" rebuilt
          ./tools/ci/reproduce.sh hash rebuilt/MPCvibedRPC.exe '${{ needs.release.outputs.exe }}'
          ./tools/ci/reproduce.sh hash rebuilt/MPCvibedRPC-linux-amd64 '${{ needs.release.outputs.linux_amd64 }}'
          ./tools/ci/reproduce.sh hash rebuilt/MPCvibedRPC-linux-arm64 '${{ needs.release.outputs.linux_arm64 }}'

  # The release as a user downloads it. While it is still a draft: the files, their checksums and build records, the
  # exe's version. Only then is it made public, and the program's own update path is tried on it: that it is the latest
  # release, and a real self-update from the release before it (its own data folder, no window, no Discord needed).
  verify:
    needs: [release, reproduce]
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write # to see the draft and make it public
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./tools/ci/version.sh '${{ github.ref_name }}'
        shell: bash
      - name: Check the draft
        shell: pwsh
        run: ./tools/ci/verify-release.ps1 -Version $env:VERSION -Stage draft
      - name: Make the release public
        shell: bash
        run: gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: Check the public release
        shell: pwsh
        run: ./tools/ci/verify-release.ps1 -Version $env:VERSION -Stage public
