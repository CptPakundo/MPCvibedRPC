name: Feature request
description: An idea for something the program could do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: There is no promise that a request will be built, but ideas are welcome.
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: What should it do, and what problem does it solve for you?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you already tried or considered