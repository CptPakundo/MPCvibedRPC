name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This program is entirely AI-generated (see the README), so there is no guarantee of a fix, but reports are welcome.

        **Privacy:** logs and screenshots can contain the names of the videos you watch and folder names. Look through them and blank out anything you don't want to share before pasting.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Program version
      description: Shown at the top right of the settings window, or run the program with `--version`.
      placeholder: e.g. 0.9.9
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: System and player versions
      placeholder: e.g. Windows 11 24H2 with MPC-HC 2.8.3, macOS 15 with IINA 1.4, Ubuntu 24.04 with VLC 3.0
  - type: textarea
    id: log
    attributes:
      label: Relevant log lines (optional)
      description: Easiest is **Copy diagnostics** on the Log tab of the settings window (titles and paths are left out). Or paste lines from the Log tab or `mpcvibedrpc.log` in the data folder (use the Data folder button).
      render: text