name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This program is entirely AI-generated (see the README), so there is no guarantee of a fix, but reports are welcome.

        **Privacy:** logs and screenshots can contain the names of the videos you watch and folder names. Look through them and blank out anything you don't want to share before pasting.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Program version
      description: Shown at the top right of the settings window, or run `MPCvibedRPC.exe --version`.
      placeholder: e.g. 0.9.2
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows and MPC-HC versions
      placeholder: e.g. Windows 11 24H2, MPC-HC 2.3.5
  - type: textarea
    id: log
    attributes:
      label: Relevant log lines (optional)
      description: From the Log tab of the settings window, or `mpcvibedrpc.log` in the data folder (use the Data folder button).
      render: text