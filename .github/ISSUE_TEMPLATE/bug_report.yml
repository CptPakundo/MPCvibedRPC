name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        There is no guarantee of a fix, but reports are welcome.

        **Privacy:** logs and screenshots can contain the names of the videos you watch and folder names. Look through them and blank out anything you don't want to share before pasting.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Program version
      description: Shown at the top right of the settings window.
      placeholder: e.g. 0.9.x, see the window's header
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: System and player versions
      placeholder: e.g. Windows 11 24H2 with MPC-HC 2.8.3, macOS 15 with IINA 1.4, Ubuntu 24.04 with VLC 3.0, Plex Media Server 1.43, Stremio 5, Jellyfin 12.2, Emby 4.9
  - type: textarea
    id: log
    attributes:
      label: Relevant log lines (optional)
      description: Easiest is **Copy diagnostics** on the Help tab of the settings window (it names what you played; folder paths, sign-ins and keys are left out). Or paste lines from the Help tab or `mpcvibedrpc.log` in the settings folder (**Open settings folder** under Advanced > Maintenance).
      render: text